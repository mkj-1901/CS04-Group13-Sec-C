<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0b0d17;
      color: #e4e6f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }

    .dashboard-card {
      width: 100%;
      max-width: 480px;
      background: rgba(17,19,35,0.85);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 48px 40px 40px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
      text-align: center;
      animation: fadeUp .5s ease-out;
    }

    @keyframes fadeUp {
      from { opacity:0; transform:translateY(18px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .avatar {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 700; color: #fff;
      text-transform: uppercase;
    }

    .greeting {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .greeting span { color: #a78bfa; }

    .subtitle {
      font-size: 1rem;
      color: #8a8ea8;
      margin-bottom: 28px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 14px 18px;
      margin-bottom: 12px;
      text-align: left;
    }

    .info-row .icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .info-row .label {
      font-size: .78rem;
      color: #8a8ea8;
      font-weight: 600;
      letter-spacing: .3px;
    }

    .info-row .value {
      font-size: .95rem;
      font-weight: 500;
    }

    .btn-logout {
      width: 100%;
      margin-top: 24px;
      padding: 13px;
      font-size: .95rem;
      font-weight: 600;
      font-family: inherit;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity .25s, transform .25s, box-shadow .25s;
    }

    .btn-logout:hover {
      opacity: .92;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      transform: translateY(-1px);
    }

    @media (max-width:480px) {
      .dashboard-card { padding: 32px 20px 28px; }
    }
  </style>
</head>
<body>

  <div class="dashboard-card">
    <div class="avatar" id="avatar"></div>

    <p class="greeting">Hello, <span id="username-display"></span> 👋</p>
    <p class="subtitle">How are you?</p>

    <div class="info-row">
      <span class="icon">📋</span>
      <div>
        <div class="label">ASSIGNMENT</div>
        <div class="value">Assignment 4 — SQL Injection Demo</div>
      </div>
    </div>

    <div class="info-row">
      <span class="icon">🎓</span>
      <div>
        <div class="label">COURSE</div>
        <div class="value">Cyber Security (IT-30001)</div>
      </div>
    </div>

    <div class="info-row">
      <span class="icon">👤</span>
      <div>
        <div class="label">LOGGED IN AS</div>
        <div class="value" id="role-display"></div>
      </div>
    </div>

    <button class="btn-logout" onclick="location.href='/'">← Back to Login</button>
  </div>

  <script>
    const params   = new URLSearchParams(window.location.search);
    const username = params.get('user') || 'Guest';
    const role     = params.get('role') || 'user';

    document.getElementById('username-display').textContent = username;
    document.getElementById('role-display').textContent     = username + ' (' + role + ')';
    document.getElementById('avatar').textContent           = username.charAt(0);
  </script>
</body>
</html>
